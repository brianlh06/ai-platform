apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-api
  template:
    metadata:
      labels:
        app: ai-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ai-api"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/ai-api"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/ai-api" -}}
          export AI_API_KEY="{{ .Data.data.AI_API_KEY }}"
          {{- end }}
    spec:
      serviceAccountName: ai-api
      containers:
      - name: ai-api
        image: ai-api:v1
        imagePullPolicy: Never
        command: ["sh", "-c", ". /vault/secrets/config && uvicorn main:app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000